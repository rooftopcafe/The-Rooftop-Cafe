<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rooftop Cafe</title>

<style>
  .logo-container{
position:fixed;
top:15px;
left:15px;
z-index:1000;
}

.logo-container img{
width:120px;
height:auto;
border-radius:10px;
}
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
margin:0;
padding:20px;
/*padding-right:380px;*/
}

h1{
text-align:center;
color:#ffb347;
}

.category{
margin-top:25px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
background:#222;
padding:12px;
margin:10px 0;
  width:100%;
border-radius:12px;
}

button{
background:#ff9800;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.cart{
position:relative;
top:auto;
right:auto;
width:auto;
background:#000;
padding:15px;
border:2px solid #ff9800;
border-radius:10px;
max-height:90vh;
overflow-y:auto;
  
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:5px;
border:none;
}

#total{
font-size:20px;
font-weight:bold;
color:#4caf50;
}
  @media screen and (max-width: 768px){

body{
padding:10px;
padding-right:10px;
}

h1{
font-size:42px;
text-align:center;
margin:10px 0 20px 0;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin:8px 0;
width:100%;
box-sizing:border-box;
}

.item span{
flex:1;
font-size:18px;
line-height:1.3;
margin-right:10px;
}

.item button{
min-width:80px;
height:45px;
font-size:16px;
}

.cart{
margin-top:20px;
width:100%;
box-sizing:border-box;
}

input{
width:100%;
box-sizing:border-box;
}

}
</style>
</head>

<body> 
<div class="logo-container">
  <img src ="logo.png" alt="The Rooftop Cafe Logo">
</div>

<h1>The Rooftop Cafe</h1>

<div id="menu"></div>

<br><br><br><br><br><br><br><br>

<div class="cart">

<h3>Customer Details</h3>

<input type="text" id="name" placeholder="Your Name">

<input type="text" id="table" placeholder="Table Number">
<div id="cartItems"></div>
<div id="total">Total ₹0</div>

<br>

<button onclick="placeOrder()" style="width:100%">
Place Order on WhatsApp
</button>

</div>

<script>

const ownerNumber="919521121759";

const menu={
  "Chai":[
{name:"Kulhad Chai",price:15},
{name:"Masala Chai",price:20},
],
  "Sandwich(Big Bread)":[
{name:"Veg Grilled Sandwich",price:60},
{name:"Cold Sandwich",price:60},
{name:"Golden corn Sandwich",price:60},
{name:"Cheese Sandwich",price:70},
{name:"Spicy Sandwich",price:70},
{name:"Paneer Sandwich",price:80},
{name:"Cheese Paneer Sandwich",price:60},
],
  "Burgers":[
{name:"Aloo Tikki Burger",price:40},
{name:"Cheese Aloo Tikki Burger",price:50},
{name:"Creamy Burger",price:60},
{name:"Paneer Burger",price:70},
{name:"Cheese Paneer Burger",price:80},
{name:"Maharaja Burger",price:90},
],
  "French Fries":[
{name:"Plain Fries",price:60},
{name:"Peri Peri Fries",price:70},
{name:"Mayo Fries",price:70},
{name:"Tandoori Fries",price:80},
],
  "Garlic Bread":[
{name:"Cheese Garlic Bread",price:75},
{name:"Spicy Garlic Bread",price:70},
{name:"Veg Farm Garlic Bread",price:90},
  ],
  "Garlic Sticks":[
{name:"Stuf Garlic Sticks",price:60},
{name:"Spicy Garlic Sticks",price:70},
{name:"Spicy Paneer Sticks",price:80},
],
  "Parcel":[
{name:"Veg Parcel",price:45},
{name:"Paneer Parcel",price:55},
{name:"Spicy Paneer Parcel",price:65},
],
  "Maggi":[
{name:"Magic Maggi",price:60},
{name:"Vegetable Maggi",price:70},
{name:"Masala Maggi",price:90},
    ],
  "Pizza":[
{name:"Plain Garlic Bread",price:120},
{name:"Cheese Garlic",price:170},
{name:"Onion Pizza",price:120},
{name:"Margarita Pizza",price:140},
{name:"OTC Pizza",price:120},
{name:"Corn Cheese Pizza",price:160},
{name:"Tadoori Paneer Pizza",price:180},
{name:"Supreme Pizza",price:250},
{name:"Cheese Bust Pizza",price:300},
],
  "Shake":[
{name:"Vanilla Shake",price:60},
{name:"Chocolate Shake",price:70},
{name:"Oreo Shake",price:70},
{name:"Kitkat Shake",price:70},
{name:"Butter Scotch",price:90},
{name:"Kesar Pista",price:100},
],
"Hot Coffee":[
{name:"Coffee",price:40},
{name:"Masala Coffee",price:50},
],
  "Cold Coffee":[
{name:"Cold Coffee",price:60},
{name:"Cold Coffee With Vanila Ice Cream",price:70},
{name:"Cold Coffee With Chocolate",price:70},
{name:"Cold Coffee With Butter Scotch",price:80},
],
  "Momos":[
{name:"Veg Momos",price:60},
{name:"Fried Momos",price:80}
    ]
};

let cart={};

const menuDiv=document.getElementById("menu");

for(let category in menu){

menuDiv.innerHTML += `
<h2 style="color:#ff9800;margin-top:30px;">
${category}
</h2>
`;

menu[category].forEach(item=>{

menuDiv.innerHTML += `
<div class="item">
<span>${item.name} - ₹${item.price}</span>

<button onclick="addToCart('${item.name}',${item.price})">
Add
</button>

</div>
`;

});

}

function addToCart(name,price){
if(cart[name]){
  cart[name].qty++;
}
 else{
   cart[name]={
     price:price,
     qty:1
   };
 }
  
  updateCart();
}

function increaseQty(name){

cart[name].qty++;

updateCart();

}

function decreaseQty(name){

cart[name].qty--;

if(cart[name].qty<=0){
delete cart[name];
}

updateCart();

}
  function updateCart(){

let total=0;
let html="<h3>Cart</h3>";

for(let name in cart){

let item=cart[name];

total += item.price * item.qty;

html += `
<div style="margin:8px 0;">
<b>${name}</b><br>

<button onclick="decreaseQty('${name}')">-</button>

 ${item.qty}

<button onclick="increaseQty('${name}')">+</button>

 ₹${item.price * item.qty}
</div>
`;

}

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerHTML="Total ₹"+total;

}
function placeOrder(){

const name=document.getElementById("name").value;
const table=document.getElementById("table").value;

if(name==""){
alert("Enter Name");
return;
}

if(Object.keys(cart).length==0){
alert("Cart Empty");
return;
}

let total=0;

let message=
"☕ THE ROOFTOP CAFE%0A%0A";

message+="Customer: "+name+"%0A";
message+="Table: "+table+"%0A%0A";
message+="Order:%0A";
for(let name in cart){

let item=cart[name];

message +=
"• "+name+
" x"+item.qty+
" = ₹"+(item.qty*item.price)+
"%0A";

total += item.qty*item.price;

}
message+="%0A------------------%0A";
message+="Total: ₹"+total;

window.open(
`https://wa.me/${ownerNumber}?text=${message}`,
'_blank'
);

}

</script>

</body>
</html>
